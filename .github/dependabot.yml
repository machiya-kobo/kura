# Version updates for the pinned GitHub Actions only. The Dockerfile base images aren't covered here: public.ecr.aws
# answers Dependabot's shared runners with 429, and tools/pin-bases keeps those digests current. The pip installs are
# inline in the Dockerfile, so they are not visible to Dependabot.
# Dependabot only opens PRs; merging one means pulling it onto main like any other commit (tests green first).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "kura: "
    groups:
      actions:
        patterns: ["*"]
